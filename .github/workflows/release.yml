name: Release

# Publishes a GitHub release whenever manifest.json names a version that has no
# release yet, which is what HACS reads to offer the update to users. Bump the
# version in custom_components/pisignage/manifest.json, merge to main, and this
# tags the commit and publishes the release for you. The existence check keeps
# it safe to re-run: a version that is already released is left alone.
on:
  push:
    branches: [main]
    paths:
      - custom_components/pisignage/manifest.json
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the manifest
        id: manifest
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/pisignage/manifest.json'))['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish the release unless it already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
