name: Release

# Publishes a GitHub release whenever a version tag is pushed, which is what
# HACS reads to offer the update to users. Tag a commit `vX.Y.Z` (matching the
# version in manifest.json) and this does the rest.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          manifest_version=$(python -c "import json; print(json.load(open('custom_components/pisignage/manifest.json'))['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
