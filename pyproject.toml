[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "D",
    "ASYNC",
    "RUF",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test helpers document themselves through their names.
"tests/*" = ["D100", "D101", "D102", "D103", "D105", "D107", "D401"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
